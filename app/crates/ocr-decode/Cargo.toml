[package]
name = "ocr-decode"
version.workspace = true
edition = "2024"
license = "MIT"

# What both engines share and neither may duplicate: THE decoding presets + the decoding step on the logits
# (ocr-core = llama.cpp, ocr-wgpu = the wgpu port). Pure Rust, no GPU, no llama.cpp — builds for the browser too.
[dependencies]
anyhow = "1.0.104"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# build.rs: the presets' data part of app/presets.json → OUT_DIR (no prose in the binaries)
[build-dependencies]
serde_json = "1"
