[package]
name = "ocr-layout"
description = "The layout tools' geometry and ink: region polygons (simplify, merge, split, straighten, sides, clear of others, give way), snap to ink, line pitch, reading order — pure Rust, no image or browser dependencies (the editor reaches it through ocr-web; native apps can link it)"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[features]
# the editor's layout worker (src/web.rs): its wasm-bindgen exports — off when ocr-web links the crate
web = ["dep:wasm-bindgen", "dep:serde_json"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# examples/inkprobe: any image the app opens (jxl, heic … via ocr-core's loader) → the grey the ink analysis reads
ocr-core = { path = "../ocr-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
