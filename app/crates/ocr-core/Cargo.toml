[package]
name = "ocr-core"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
ocr-decode = { path = "../ocr-decode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moxcms = "0.9.1"
# JPEG XL input — pure Rust, builds for wasm; rayon threads only natively
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image", "rayon"] }
