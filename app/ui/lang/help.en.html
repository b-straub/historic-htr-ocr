<template data-slot="help">
<h3>Setup</h3>
<p>OCR Lite needs the model (1.4 GB) in this browser's storage — the setup checks the device and downloads it once from Hugging Face. If you already have the model's two files (<code>text-q8_0.gguf</code> and <code>mmproj-bf16.gguf</code>, from its Hugging Face repository), choose “I have the files…” in the setup instead: they are checked against the released model and stored without a download. An installed app (Home Screen, Dock, Chrome / Edge app) has its own storage: set it up inside the app you use.</p>
<p>The model is <a href="https://huggingface.co/b-straub/LightOnOCR-3-1B-Historic-German-Handwriting" target="_blank" rel="noopener">LightOnOCR-3-1B · Historic German Handwriting</a> (open, CC BY-SA 4.0). About the project, the output format and the source: <a href="https://b-straub.github.io/historic-htr-ocr/" target="_blank" rel="noopener">the project page</a> and <a href="https://github.com/b-straub/historic-htr-ocr" target="_blank" rel="noopener">GitHub</a> (questions and reading errors worth reporting: its issues).</p>
<h3>Workflow</h3>
<ol>
  <li><b>Open</b> an image, or drop it on the image pane.</li>
  <li>The tools come in three rows: <b>Crop</b> (what part of the image), <b>Adjust</b> (how it looks to the model), <b>Read</b>. On a phone's side the first two share a line.</li>
  <li><b>Crop</b> row: when an image opens, <b>Auto</b> puts a rectangle around the writing by itself (the whole image when it finds none). Turn the image first if it lies on its side — Auto runs again. OCR Lite reads best on a whole block of text: put the rectangle around the part of the writing you want, with whole lines — not single words or very small pieces. Drag the rectangle's handles (corners and edge middles; the one you hold lights up) to adjust it<span class="kbd">, inside it to move it</span> — on a touch screen a finger anywhere else pans and two fingers zoom — then the green ✓ (Apply); the red ✕ cancels. A book spread: the ▾ beside Auto chooses <b>Left</b>, <b>Right</b> or <b>Double</b> — the left page, the right page or both, split at the page gutter; the button then shows that mode and repeats it. ✕ leaves the image uncropped — Auto brings the rectangle back; on a cropped image Auto starts again from the uncropped one. Read waits for the crop. Undo and back to the original at the row's end.</li>
  <li><b>Adjust</b> row: <b>Contrast</b> for faint ink, <b>Pencil</b> for uneven paper — each is on or off, a second press takes it out.</li>
  <li><b>Scale</b>: a crop is read at ×1 — its own pixels (a crop larger than the model's 1540 px input at that limit). After the read OCR Lite measures how wide a character comes to the model: per line the input's width / the line's characters, the median over the lines. On the training pages the median is 23 px a character; OCR Lite aims at a band of 18 … 23 px (middle 20), a little lower, as a tight crop has fewer margins than a training page. After a read a tap on the wand (<b>Better scale</b>) reads again at the step for the middle (20 px); tapped again while that step is in use it goes back to ×1. Its ▾ opens the menu: the middle, the band's lower and upper end (18, 23 px), and ×1 — factors in steps of 0.1 (0.25 from ×1.5 on), never past the 1540 px input; a step reads again with it (×1 only sets it back). Outside the band the status line says so and the wand is lit; it stays marked while a step other than ×1 is in use. Beside it the scale now; the Read row shows the image (or crop) → the model input's size. To check what the model sees: Save → model input image (.png), at the current scale.</li>
  <li><b>Read</b> — the text streams in; Stop ends the read at once (the text so far stays).</li>
  <li><b>Edit</b> the text: the format buttons, ▨ for illegible, Markup for the raw markup. <b>Fit</b> (on by default) shows every line as written, the text scaled to the panel's width.</li>
  <li><b>Save</b>: the markup (.txt), the rendered page (.html) or the model's input image (.png).</li>
</ol>
<h3>Phone, and tablet upright</h3>
<p>Image and Text are two tabs (a bar at the bottom; on a phone's side after the logo); each keeps its zoom and scroll, and shows only its own tools. A new image opens on Image, a read switches to Text as its text begins.</p>
<h3>Zoom</h3>
<p>− / + / fit above the image<span class="kbd">; ⌘ / ctrl + wheel or a trackpad pinch</span>; two fingers on a touch screen. A drag pans; a <span class="kbd">double-click or </span>double-tap fits. The text zooms the same way (two fingers<span class="kbd">, ⌘ / ctrl + wheel</span>); Fit starts it again from the whole line width.</p>
<h3>Status line</h3>
<p><b>load</b> the model's weights onto the GPU (each read) · <b>image</b> the page encoded · <b>prefill</b> the prompt read · <b>tok/s</b> the reading speed. "hit the token limit" = the read ran away: crop tighter or try another preset. "stopped: the app went to the background" = switching apps stops a read; read again.</p>
<h3>Language</h3>
<p>OCR Lite speaks English and German and follows the browser's language; Settings can choose one.</p>
<h3>Expert mode</h3>
<p>Settings → Expert mode shows the decoding presets (the list beside Read and their editor) and technical details such as the model files and the GPU memory; off, every read uses the default preset greedy_rp1.1.</p>
<h3>Offline</h3>
<p>Once downloaded, the model stays in this browser's storage and OCR Lite reads without a connection. Settings shows the stored files; deleting them frees the 1.4 GB.</p>
<h3>Devices</h3>
<p>A read takes about 1.8 GB of GPU memory, given back when it ends: iPad and Mac with Apple silicon are fine; iPhone is experimental (tested: iPhone 16 Pro, 43 tokens/s; iPhone 18 Pro, 80 tokens/s). On iPhone and iPad the device check also tests the memory, before the download. Chrome / Edge 113+, Safari 26+; Firefox is not supported.</p>
<p><b>Check this device</b> tests the GPU (WebGPU, its limits, a 1-second speed test) and estimates the reading speed. A laptop with two GPUs may run the browser on the slower built-in one — the check then says how to switch to the graphics card.</p>
<h3>Tech preview</h3>
<p>Reading in the browser with WebGPU is work in progress; on phones and tablets OCR Lite is not production-ready yet. Edits are not kept: a crash or a reload loses the text on the right — copy or save what you change. Real editing, with the work kept, is the next major step. A read interrupted by switching to another app starts again from the beginning when you come back.</p>
<h3>Privacy</h3>
<p>Everything runs on this device: images and texts never leave it.</p>
</template>
<template data-slot="howto.tips">
<li>Faint ink: switch Contrast ◐ on.</li>
<li>Uneven, stained or yellowed paper: switch Pencil on.</li>
<li>A page on its side or upside down: turn it first with the arrows.</li>
<li>A book spread (two pages in one image): ▾ beside Auto → Left, Right or Double.</li>
<li>Very small or very large writing: crop first, then the wand (Auto scale) — small letters read much better enlarged.</li>
<li>The text repeats or never ends: crop tighter — one page, one text block — and read again.</li>
<li>Edits are not kept yet: copy or save the text before closing the app.</li>
</template>
