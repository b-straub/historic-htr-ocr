<template data-slot="help">
<h3>Einrichtung</h3>
<p>OCR Lite braucht das Modell (1,4 GB) im Speicher dieses Browsers — die Einrichtung prüft das Gerät und lädt das Modell einmal von Hugging Face herunter. Eine installierte App (Home-Bildschirm, Dock, Chrome- / Edge-App) hat einen eigenen Speicher: die Einrichtung in der App durchführen, die genutzt wird.</p>
<p>Das Modell ist <a href="https://huggingface.co/b-straub/LightOnOCR-3-1B-Historic-German-Handwriting" target="_blank" rel="noopener">LightOnOCR-3-1B · Historic German Handwriting</a> (offen, CC BY-SA 4.0). Mehr zum Projekt, zum Ausgabeformat und zum Quellcode: <a href="https://b-straub.github.io/historic-htr-ocr/" target="_blank" rel="noopener">die Projektseite</a> und <a href="https://github.com/b-straub/historic-htr-ocr" target="_blank" rel="noopener">GitHub</a> (Fragen und meldenswerte Lesefehler: dort unter Issues).</p>
<h3>Ablauf</h3>
<ol>
  <li><b>Öffnen</b>: ein Bild öffnen oder auf die Bildfläche ziehen.</li>
  <li>Die Werkzeuge stehen in drei Reihen: <b>Zuschnitt</b> (welcher Teil des Bildes), <b>Anpassen</b> (wie das Modell das Bild sieht), <b>Lesen</b>. Beim quer gehaltenen Handy teilen sich die ersten beiden eine Zeile.</li>
  <li>Reihe <b>Zuschnitt</b>: beim Öffnen eines Bildes legt <b>Auto</b> von selbst ein Rechteck um die Schrift (um das ganze Bild, wenn es keine findet). Liegt das Bild quer, zuerst drehen — Auto läuft dann erneut. Die Griffe des Rechtecks (Ecken und Kantenmitten; der gehaltene leuchtet) ziehen, um es anzupassen<span class="kbd">, innen ziehen, um es zu verschieben</span> — auf einem Touchscreen verschiebt ein Finger anderswo das Bild, zwei Finger zoomen — dann das grüne ✓ (übernehmen); das rote ✕ bricht ab. Eine Doppelseite: das ▾ neben Auto wählt <b>Links</b>, <b>Rechts</b> oder <b>Doppel</b> — die linke Seite, die rechte oder beide, getrennt am Falz; der Knopf zeigt dann diesen Modus und wiederholt ihn. ✕ lässt das Bild unbeschnitten — Auto bringt das Rechteck zurück; auf einem zugeschnittenen Bild beginnt Auto wieder beim unbeschnittenen. Lesen wartet auf den Zuschnitt. Rückgängig und „zurück zum Original“ am Ende der Reihe.</li>
  <li>Reihe <b>Anpassen</b>: <b>Kontrast</b> für blasse Tinte, <b>Bleistift</b> für ungleichmäßiges Papier — beide sind ein oder aus, ein zweiter Druck nimmt sie wieder heraus.</li>
  <li><b>Skalierung</b> (Reihe Anpassen): wie groß die Buchstaben beim Modell ankommen. Vor dem Zuschnitt ist der Regler aus. Auf einem zugeschnittenen Bild stellt der Regler die Buchstabenhöhe in px ein — von 9 bis 45 px (das Modell hat mit Buchstaben von 11 … 43 px Höhe gelernt), und nie über die 1540 px Eingabe des Modells hinaus; erreicht der Regler 9 px nicht, enger zuschneiden. Jeder Zuschnitt bekommt gleich die Auto-Skalierung. Der Zauberstab (<b>Auto-Skalierung</b>) vergrößert Buchstaben unter 30 px zu 30 px hin (dort liest das Modell am besten), soweit die 1540 px Eingabe es zulässt, lässt 30 … 43 px bei 1:1 und verkleinert größere auf 43 px — winzige Schrift wird größer, eine Nahaufnahme kleiner; nach einer Bewegung des Reglers steht er wieder bereit. Daneben: der Faktor zum Modell und die Buchstabenhöhe dort; die Reihe Lesen zeigt Bild (oder Zuschnitt) → Größe der Modelleingabe.</li>
  <li><b>Lesen</b> — der Text läuft nach und nach ein; Stopp beendet das Lesen sofort (der Text bis dahin bleibt).</li>
  <li><b>Bearbeiten</b>: die Format-Knöpfe, ▨ für Unleserliches, Markup für den Rohtext. <b>Einpassen</b> (standardmäßig an) zeigt jede Zeile wie geschrieben, den Text auf die Breite der Fläche verkleinert.</li>
  <li><b>Speichern</b>: das Markup (.txt), die gestaltete Seite (.html) oder das Eingabebild des Modells (.png).</li>
</ol>
<h3>Handy und Tablet hochkant</h3>
<p>Bild und Text sind zwei Reiter (eine Leiste unten; beim quer gehaltenen Handy nach dem Logo); jeder behält Zoom und Bildlauf und zeigt nur seine eigenen Werkzeuge. Ein neues Bild öffnet sich unter Bild; beim Lesen wechselt die Ansicht zu Text, sobald der Text beginnt.</p>
<h3>Zoom</h3>
<p>− / + / einpassen über dem Bild<span class="kbd">; ⌘ / Strg + Mausrad oder zwei Finger auf dem Trackpad</span>; zwei Finger auf einem Touchscreen. Ziehen verschiebt das Bild; <span class="kbd">ein Doppelklick oder </span>doppeltes Tippen passt es ein. Der Text zoomt genauso (zwei Finger<span class="kbd">, ⌘ / Strg + Mausrad</span>); Einpassen beginnt wieder bei der ganzen Zeilenbreite.</p>
<h3>Statuszeile</h3>
<p><b>Laden</b> die Gewichte des Modells auf die GPU (bei jedem Lesen) · <b>Bild</b> die Seite kodiert · <b>prefill</b> den Prompt gelesen · <b>tok/s</b> die Lesegeschwindigkeit. „Token-Limit erreicht“ = das Lesen ist entgleist: enger zuschneiden oder ein anderes Preset versuchen. „Gestoppt: die App ging in den Hintergrund“ = ein App-Wechsel stoppt das Lesen; neu lesen.</p>
<h3>Sprache</h3>
<p>OCR Lite spricht Deutsch und Englisch und folgt der Sprache des Browsers; in den Einstellungen lässt sich eine Sprache fest wählen.</p>
<h3>Expertenmodus</h3>
<p>Einstellungen → Expertenmodus zeigt die Lese-Presets (die Liste neben Lesen und ihren Editor) und technische Details wie die Modelldateien und den GPU-Speicher; ausgeschaltet nutzt jedes Lesen das Standard-Preset greedy_rp1.1.</p>
<h3>Offline</h3>
<p>Einmal heruntergeladen, bleibt das Modell im Speicher dieses Browsers, und OCR Lite liest ohne Verbindung. Die Einstellungen zeigen die gespeicherten Dateien; sie zu löschen gibt die 1,4 GB frei.</p>
<h3>Geräte</h3>
<p>Ein Lesevorgang braucht etwa 1,8 GB GPU-Speicher, der danach wieder frei wird: iPad und Mac mit Apple-Chip sind gut geeignet; das iPhone ist experimentell (getestet: iPhone 16 Pro, 43 Tokens/s; iPhone 18 Pro, 80 Tokens/s). Auf iPhone und iPad prüft die Geräteprüfung vor dem Download auch den Speicher. Chrome / Edge 113+, Safari 26+; Firefox wird nicht unterstützt.</p>
<p><b>Dieses Gerät prüfen</b> testet die GPU (WebGPU, ihre Grenzen, ein Geschwindigkeitstest von einer Sekunde) und schätzt die Lesegeschwindigkeit. Ein Laptop mit zwei GPUs lässt den Browser manchmal auf der langsameren eingebauten laufen — die Prüfung sagt dann, wie man auf die Grafikkarte umschaltet.</p>
<h3>Technische Vorschau</h3>
<p>Lesen im Browser mit WebGPU ist noch in Arbeit; auf Handys und Tablets ist OCR Lite noch nicht ausgereift. Änderungen werden nicht behalten: ein Absturz oder Neuladen verliert den Text rechts — Geändertes kopieren oder speichern. Richtiges Bearbeiten, bei dem die Arbeit erhalten bleibt, ist der nächste große Schritt. Ein Lesevorgang, der durch den Wechsel in eine andere App unterbrochen wurde, beginnt beim Zurückkehren von vorn.</p>
<h3>Datenschutz</h3>
<p>Alles läuft auf diesem Gerät: Bilder und Texte verlassen es nie.</p>
</template>
<template data-slot="howto.tips">
<li>Blasse Tinte: Kontrast ◐ einschalten.</li>
<li>Fleckiges, ungleichmäßiges oder vergilbtes Papier: Bleistift einschalten.</li>
<li>Seite liegt quer oder steht auf dem Kopf: zuerst mit den Pfeilen drehen.</li>
<li>Eine Doppelseite (zwei Seiten in einem Bild): ▾ neben Auto → Links, Rechts oder Doppel.</li>
<li>Sehr kleine oder sehr große Schrift: zuerst zuschneiden, dann der Zauberstab (Auto-Skalierung) — kleine Buchstaben liest das Modell vergrößert viel besser.</li>
<li>Der Text wiederholt sich oder endet nicht: enger zuschneiden — eine Seite, ein Textblock — und neu lesen.</li>
<li>Änderungen werden noch nicht behalten: den Text vor dem Schließen kopieren oder speichern.</li>
</template>
